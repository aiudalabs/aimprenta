<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1080 560" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="aap-title aap-desc" font-family="'IBM Plex Mono', 'SFMono-Regular', Menlo, monospace">
  <title id="aap-title">aimprenta: angle to publish-ready short-form article</title>
  <desc id="aap-desc">Workflow diagram: an angle moves through article-author's conditional fact-check, a single-pass draft, an editorial pass, one approval gate, and platform-specific formatting — the lightest of the three aimprenta pipelines.</desc>

  <defs>
    <marker id="ap-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9aa0a8"/>
    </marker>
  </defs>

  <style>
    text { fill: #14171c; }
    .lane-label { font-size: 11px; font-weight: 600; letter-spacing: .04em; fill: #5b6472; text-transform: uppercase; }
    .node-title { font-size: 13px; font-weight: 600; }
    .node-sub { font-size: 10.5px; fill: #5b6472; }
    .edge { fill: none; stroke: #9aa0a8; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#ap-arrow); }
    .edge-dashed { stroke-dasharray: 4 4; }
    .lane-band { stroke-width: 1.2; }
    .lane-band.author { fill: #0e7c6b0d; stroke: #0e7c6b33; }
    .lane-band.gate { fill: #a8322d0d; stroke: #a8322d55; stroke-dasharray: 5 4; }
    .lane-band.editor { fill: #b5560f0d; stroke: #b5560f33; }
    .lane-band.publish { fill: #2a4b9b0d; stroke: #2a4b9b33; }
    .node-box { stroke-width: 1.6; fill: #ffffff; }
    .node-box.author { stroke: #0e7c6b; }
    .node-box.gate { stroke: #a8322d; }
    .node-box.editor { stroke: #b5560f; }
    .node-box.publish { stroke: #2a4b9b; }
    .node-box.conditional { stroke-dasharray: 4 3; }
  </style>

  <rect x="0" y="0" width="1080" height="560" fill="#fbfbfa"/>

  <rect class="lane-band author" x="20" y="90" width="1040" height="110" rx="10"/>
  <text class="lane-label" x="36" y="108">article-author — angle &amp; drafting</text>

  <rect class="lane-band gate" x="20" y="210" width="1040" height="90" rx="10"/>
  <text class="lane-label" x="36" y="226" fill="#a8322d">1 approval gate</text>

  <rect class="lane-band editor" x="20" y="310" width="1040" height="110" rx="10"/>
  <text class="lane-label" x="36" y="328">article-author — editorial</text>

  <rect class="lane-band publish" x="20" y="430" width="1040" height="110" rx="10"/>
  <text class="lane-label" x="36" y="448">article-author — platform format</text>

  <g class="edge">
    <path d="M195,145 L245,145"/>
    <path d="M395,145 L445,145"/>
    <path d="M595,145 L615,145 L615,365 L645,365"/>
    <path d="M720,333 L720,287"/>
    <path d="M795,255 L870,255 L870,485 L845,485"/>
  </g>

  <g>
    <rect class="node-box author" x="45" y="113" width="150" height="64" rx="9"/>
    <text class="node-title" x="60" y="138">Angle</text>
    <text class="node-sub" x="60" y="154">thesis + audience</text>
  </g>

  <g>
    <rect class="node-box author conditional" x="245" y="113" width="150" height="64" rx="9"/>
    <text class="node-title" x="260" y="133">Fact-check</text>
    <text class="node-sub" x="260" y="149">only if the piece</text>
    <text class="node-sub" x="260" y="161">makes a claim</text>
  </g>

  <g>
    <rect class="node-box author" x="445" y="113" width="150" height="64" rx="9"/>
    <text class="node-title" x="460" y="138">Draft</text>
    <text class="node-sub" x="460" y="154">single pass, one thesis</text>
  </g>

  <g>
    <rect class="node-box editor" x="645" y="333" width="150" height="64" rx="9"/>
    <text class="node-title" x="660" y="353">Editorial pass</text>
    <text class="node-sub" x="660" y="368">sciwrite (clarity) +</text>
    <text class="node-sub" x="660" y="380">humanizer (voice)</text>
  </g>

  <g>
    <rect class="node-box gate" x="645" y="223" width="150" height="64" rx="9"/>
    <text class="node-title" x="660" y="248" fill="#a8322d">Approve</text>
    <text class="node-sub" x="660" y="264">to publish</text>
  </g>

  <g>
    <rect class="node-box publish" x="845" y="453" width="150" height="64" rx="9"/>
    <text class="node-title" x="860" y="473">Platform format</text>
    <text class="node-sub" x="860" y="488">LinkedIn / Medium / MD</text>
    <text class="node-sub" x="860" y="500">limits checked live</text>
  </g>

  <g font-size="10.5" fill="#5b6472">
    <rect x="20" y="524" width="12" height="12" rx="3" fill="#ffffff" stroke="#0e7c6b" stroke-width="1.6"/>
    <text x="38" y="534">skill stage</text>
    <rect x="140" y="524" width="12" height="12" rx="3" stroke-dasharray="3 2" fill="#ffffff" stroke="#0e7c6b" stroke-width="1.6"/>
    <text x="158" y="534">conditional stage</text>
    <rect x="290" y="524" width="12" height="12" rx="3" fill="#ffffff" stroke="#a8322d" stroke-width="1.6"/>
    <text x="308" y="534">human approval gate</text>
  </g>
  <text x="1060" y="534" font-size="10" fill="#82878e" text-anchor="end">aiudalabs/aimprenta</text>
</svg>
