<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 620" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="aip-title aip-desc" font-family="'IBM Plex Mono', 'SFMono-Regular', Menlo, monospace">
  <title id="aip-title">aimprenta: idea to sellable book</title>
  <desc id="aip-desc">Workflow diagram: an idea moves through book-author, two human approval gates, scientific-book-editor's review panel, and production-book-publisher into a shippable interior and EPUB.</desc>

  <style>
    text { fill: #14171c; }
    .lane-label { font-size: 11px; font-weight: 600; letter-spacing: .04em; fill: #5b6472; text-transform: uppercase; }
    .phase-label { font-size: 11px; font-weight: 600; letter-spacing: .06em; fill: #82878e; text-transform: uppercase; text-anchor: middle; }
    .node-title { font-size: 13.5px; font-weight: 600; }
    .node-sub { font-size: 10.5px; fill: #5b6472; }
    .node-tag { font-size: 9px; fill: #ffffff; font-weight: 600; }
    .edge { fill: none; stroke: #9aa0a8; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .edge-flow { stroke-dasharray: 7 6; animation: dash-flow 1s linear infinite; }
    .lane-band { stroke-width: 1.2; }
    .lane-band.author { fill: #0e7c6b0d; stroke: #0e7c6b33; }
    .lane-band.gate { fill: #a8322d0d; stroke: #a8322d55; stroke-dasharray: 5 4; }
    .lane-band.editor { fill: #b5560f0d; stroke: #b5560f33; }
    .lane-band.production { fill: #2a4b9b0d; stroke: #2a4b9b33; }
    .node-box { stroke-width: 1.6; fill: #ffffff; }
    .node-box.author { stroke: #0e7c6b; }
    .node-box.gate { stroke: #a8322d; animation: gate-pulse 2.4s ease-in-out infinite; }
    .node-box.editor { stroke: #b5560f; }
    .node-box.production { stroke: #2a4b9b; }
    .tag-chip.author { fill: #0e7c6b; }
    .tag-chip.gate { fill: #a8322d; }
    .tag-chip.editor { fill: #b5560f; }
    .tag-chip.production { fill: #2a4b9b; }
    .traveler { fill: #ffb020; filter: drop-shadow(0 0 4px #ffb02099); }

    @keyframes dash-flow {
      to { stroke-dashoffset: -26; }
    }
    @keyframes gate-pulse {
      0%, 100% { stroke-opacity: 1; }
      50% { stroke-opacity: .45; }
    }
    @media (prefers-reduced-motion: reduce) {
      .edge-flow { animation: none; }
      .node-box.gate { animation: none; }
      #traveler-motion { display: none; }
    }
  </style>

  <!-- background -->
  <rect x="0" y="0" width="1280" height="620" fill="#fbfbfa"/>

  <!-- phase headers -->
  <text class="phase-label" x="310" y="34">Idea → manuscript</text>
  <text class="phase-label" x="690" y="34">Editorial QA</text>
  <text class="phase-label" x="995" y="34">Sellable artifacts</text>
  <line x1="20" y1="46" x2="480" y2="46" stroke="#0e7c6b" stroke-width="1.5"/>
  <line x1="530" y1="46" x2="850" y2="46" stroke="#b5560f" stroke-width="1.5"/>
  <line x1="900" y1="46" x2="1180" y2="46" stroke="#2a4b9b" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- lane bands -->
  <rect class="lane-band author" x="20" y="90" width="1240" height="110" rx="10"/>
  <text class="lane-label" x="36" y="108">01 · book-author</text>

  <rect class="lane-band gate" x="20" y="210" width="1240" height="90" rx="10"/>
  <text class="lane-label" x="36" y="226" fill="#a8322d">EX · Author approval</text>

  <rect class="lane-band editor" x="20" y="310" width="1240" height="110" rx="10"/>
  <text class="lane-label" x="36" y="328">03 · scientific-book-editor</text>

  <rect class="lane-band production" x="20" y="430" width="1240" height="110" rx="10"/>
  <text class="lane-label" x="36" y="448">04 · production-book-publisher</text>

  <!-- edges (orthogonal, animated flow) -->
  <g class="edge edge-flow">
    <path d="M195,145 L235,145"/>
    <path d="M310,177 L310,223"/>
    <path d="M385,255 L460,255 L460,145 L425,145"/>
    <path d="M575,145 L650,145 L650,365 L615,365"/>
    <path d="M690,333 L690,287"/>
    <path d="M765,255 L840,255 L840,365 L805,365"/>
    <path d="M955,365 L1030,365 L1030,485 L995,485"/>
  </g>

  <!-- arrowheads -->
  <g fill="#9aa0a8">
    <path d="M235,145 L227,141 L227,149 Z"/>
    <path d="M310,223 L306,215 L314,215 Z"/>
    <path d="M425,145 L417,141 L417,149 Z"/>
    <path d="M615,365 L607,361 L607,369 Z"/>
    <path d="M690,287 L686,295 L694,295 Z"/>
    <path d="M805,365 L797,361 L797,369 Z"/>
    <path d="M995,485 L987,481 L987,489 Z"/>
  </g>

  <!-- traveling pulse: one idea, riding the whole pipeline -->
  <circle id="traveler-motion" class="traveler" r="5">
    <animateMotion dur="8s" repeatCount="indefinite"
      path="M120,145 L195,145 L235,145 L310,145 L310,177 L310,223 L310,255 L385,255 L460,255 L460,145 L425,145 L500,145 L575,145 L650,145 L650,365 L615,365 L690,365 L690,333 L690,287 L690,255 L765,255 L840,255 L840,365 L805,365 L880,365 L955,365 L1030,365 L1030,485 L995,485 L1070,485"/>
    <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.03;0.9;0.97;1" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- nodes -->
  <!-- idea -->
  <g>
    <rect class="node-box author" x="45" y="113" width="150" height="64" rx="9"/>
    <text class="node-title" x="60" y="138">Idea</text>
    <text class="node-sub" x="60" y="154">one-line brief</text>
  </g>

  <!-- outline -->
  <g>
    <rect class="node-box author" x="235" y="113" width="150" height="64" rx="9"/>
    <text class="node-title" x="250" y="138">Outline</text>
    <text class="node-sub" x="250" y="154">SYLLABUS.md</text>
  </g>

  <!-- gate 1 -->
  <g>
    <rect class="node-box gate" x="235" y="223" width="150" height="64" rx="9"/>
    <text class="node-title" x="250" y="248" fill="#a8322d">Approve</text>
    <text class="node-sub" x="250" y="264">brief + outline</text>
  </g>

  <!-- draft -->
  <g>
    <rect class="node-box author" x="425" y="113" width="150" height="64" rx="9"/>
    <text class="node-title" x="440" y="136">Draft chapters</text>
    <text class="node-sub" x="440" y="151">code + tests + claims</text>
    <rect class="tag-chip author" x="440" y="158" width="72" height="14" rx="7"/>
    <text class="node-tag" x="447" y="168">17 agents</text>
  </g>

  <!-- editorial QA -->
  <g>
    <rect class="node-box editor" x="615" y="333" width="150" height="64" rx="9"/>
    <text class="node-title" x="630" y="356">Editorial QA</text>
    <text class="node-sub" x="630" y="371">panel + peer + citations</text>
    <rect class="tag-chip editor" x="630" y="378" width="98" height="14" rx="7"/>
    <text class="node-tag" x="637" y="388">10 review passes</text>
  </g>

  <!-- gate 2 -->
  <g>
    <rect class="node-box gate" x="615" y="223" width="150" height="64" rx="9"/>
    <text class="node-title" x="630" y="248" fill="#a8322d">Approve</text>
    <text class="node-sub" x="630" y="264">revision policy</text>
  </g>

  <!-- revise -->
  <g>
    <rect class="node-box editor" x="805" y="333" width="150" height="64" rx="9"/>
    <text class="node-title" x="820" y="358">Revise + copyedit</text>
    <text class="node-sub" x="820" y="374">revised-book/</text>
  </g>

  <!-- artifacts -->
  <g>
    <rect class="node-box production" x="995" y="453" width="150" height="64" rx="9"/>
    <text class="node-title" x="1010" y="476">Interior + EPUB</text>
    <text class="node-sub" x="1010" y="492">dist/, KDP-ready</text>
  </g>

  <!-- legend -->
  <g font-size="10.5" fill="#5b6472">
    <rect x="20" y="562" width="12" height="12" rx="3" fill="#ffffff" stroke="#0e7c6b" stroke-width="1.6"/>
    <text x="38" y="572">skill stage</text>
    <rect x="140" y="562" width="12" height="12" rx="3" fill="#ffffff" stroke="#a8322d" stroke-width="1.6"/>
    <text x="158" y="572">human approval gate</text>
    <circle cx="330" cy="568" r="5" fill="#ffb020"/>
    <text x="344" y="572">the idea, moving through the pipeline</text>
  </g>
  <text x="1260" y="572" font-size="10" fill="#82878e" text-anchor="end">aiudalabs/aimprenta</text>
</svg>
